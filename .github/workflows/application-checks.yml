name: Application checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/real-multipage-navigation"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run application structure and safety tests
        run: npm test
